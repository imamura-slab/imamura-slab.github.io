<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>おなか暦 サポート</title>
  <style>
    :root { color-scheme: light dark; --accent: #2f7d55; --surface: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --border: #d2d2d7; }
    @media (prefers-color-scheme: dark) { :root { --surface: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --border: #3a3a3c; } }
    body { margin: 0; background: var(--surface); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.75; }
    main { box-sizing: border-box; max-width: 720px; margin: 0 auto; padding: 64px 24px 48px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.04em; }
    h2 { margin-top: 42px; font-size: 1.25rem; }
    p { margin: 12px 0; }
    .lead { color: var(--muted); font-size: 1.15rem; }
    .card { margin-top: 28px; padding: 22px; border: 1px solid var(--border); border-radius: 18px; }
    a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
    footer { margin-top: 52px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>おなか暦</h1>
    <p class="lead">お腹の調子を、気軽に記録。</p>

    <section class="card">
      <h2>サポート</h2>
      <p>ご質問・ご要望は、以下のメールアドレスまでお送りください。</p>
      <p><a href="mailto:support_app-mail@yahoo.co.jp">support_app-mail@yahoo.co.jp</a></p>
      <p>お問い合わせの際は、可能であればご利用のiPhone機種、iOSバージョン、アプリのバージョン、発生した状況をお知らせください。</p>
    </section>

    <section>
      <h2>関連リンク</h2>
      <p><a href="privacy.html">プライバシーポリシー</a></p>
    </section>

    <footer>© 2026 おなか暦</footer>
  </main>
</body>
</html>
