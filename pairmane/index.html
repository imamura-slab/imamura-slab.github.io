<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ペアマネ サポート</title>
  <style>
    :root { color-scheme: light dark; --accent: #5597c9; --accent2: #f08aad; --surface: #ffffff; --text: #25272b; --muted: #676b73; --border: #dfe3e8; }
    @media (prefers-color-scheme: dark) { :root { --surface: #1c1c1e; --text: #f5f5f7; --muted: #b2b2b8; --border: #3a3a3c; } }
    body { margin: 0; background: var(--surface); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.75; }
    main { box-sizing: border-box; max-width: 720px; margin: 0 auto; padding: 64px 24px 48px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.04em; }
    h2 { margin-top: 42px; font-size: 1.25rem; }
    p { margin: 12px 0; }
    .lead { color: var(--muted); font-size: 1.15rem; }
    .card { margin-top: 28px; padding: 22px; border: 1px solid var(--border); border-radius: 18px; }
    a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
    footer { margin-top: 52px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>ペアマネ</h1>

    <section class="card">

      <p>ご質問、不具合、ご要望は、以下のメールアドレスまでお送りください。</p>

    </section>

    <section>
      <h2>関連リンク</h2>

    <footer>© 2026 ペアマネ</footer>
